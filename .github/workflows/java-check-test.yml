name: Java build with Gradle

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: Java ${{ matrix.java-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 8, 11, 17, 21, 25 ]
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java-version }} for the tests
        id: test-jdk
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: ${{ matrix.java-version }}

      # set up last, so it becomes JAVA_HOME and runs Gradle
      - name: Set up JDK 21 for Gradle
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: 21

      # also validates the Gradle wrapper
      - uses: gradle/actions/setup-gradle@v6

      # PowerShell (the Windows default) splits -D arguments at the dots
      - shell: bash
        run: >
          ./gradlew build
          -PtestJavaVersion=${{ matrix.java-version }}
          -Dorg.gradle.java.installations.paths="${{ steps.test-jdk.outputs.path }}"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results (Java ${{ matrix.java-version }} on ${{ matrix.os }})
          path: lib/build/reports/tests/test/
