version: 2
updates:
  - package-ecosystem: "gradle"
    directories:
      - "/"
      - "/lib"
      - "/example"
    schedule:
      interval: "weekly"
    groups:
      gradle-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
