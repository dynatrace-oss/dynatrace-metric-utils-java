plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'com.diffplug.spotless' version '8.10.4'
}

group 'com.dynatrace.metric.util'
version = '2.6.0'

repositories {
    mavenCentral()
}

dependencies {
    // JUnit 6 needs Java 17, so stay on JUnit 5 while the tests run on Java 8.
    testImplementation(platform('org.junit:junit-bom:5.14.4'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
    testImplementation('org.awaitility:awaitility:4.3.0')
}

// Gradle runs on a recent JDK. Pass -PtestJavaVersion=<n> to run the tests on that Java version
// instead (it must be installed), e.g. ./gradlew test -PtestJavaVersion=8
def testJavaVersion = findProperty('testJavaVersion')

test {
    useJUnitPlatform()
    if (testJavaVersion) {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(testJavaVersion as int)
        }
    }
    testLogging {
        events "passed", "skipped", "failed"
    }
}

java {
    withJavadocJar()
    withSourcesJar()
}

// build with any recent JDK, but only allow the Java 8 API
tasks.withType(JavaCompile).configureEach {
    options.release = 8
    // newer JDKs warn that release 8 is obsolete
    options.compilerArgs << '-Xlint:-options'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'dynatrace-metric-utils-java'

            from components.java

            pom {
                name = 'dynatrace-metric-utils-java'
                description = 'Utility for preparing communication with the Dynatrace v2 metrics API.'
                url = 'https://github.com/dynatrace-oss/dynatrace-metric-utils-java'

                scm {
                    connection = 'scm:git:git://github.com/dynatrace-oss/dynatrace-metric-utils-java.git'
                    developerConnection = 'scm:git:ssh://github.com:dynatrace-oss/dynatrace-metric-utils-java.git'
                    url = 'https://github.com/dynatrace-oss/dynatrace-metric-utils-java'
                }

                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }

                developers {
                    developer {
                        name = 'Dynatrace Open Source Engineering'
                        email = 'opensource@dynatrace.com'
                        organization = 'Dynatrace LLC'
                        organizationUrl = 'https://www.dynatrace.com'
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'sonatype'
            url = 'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/'
            credentials {
                username = findProperty('sonatypeUsername')
                password = findProperty('sonatypePassword')
            }
        }
    }
}

signing {
    def signingKey = findProperty('signingKey')
    def signingPassword = findProperty('signingPassword')
    useInMemoryPgpKeys(signingKey, signingPassword)
    sign publishing.publications.mavenJava
}

spotless {
    java {
        // the formatter version is managed by spotless
        googleJavaFormat()
    }
}
